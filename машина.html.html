<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Черный джип</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        body {
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 70%, #556B2F 70%, #2E4A1E 100%);
            overflow: hidden;
            position: relative;
        }

        
        body::before {
            content: '';
            position: absolute;
            bottom: 15%;
            left: 0;
            width: 100%;
            height: 40px;
            background: #555;
            border-top: 5px solid #444;
            border-bottom: 5px solid #444;
        }

       
        body::after {
            content: '';
            position: absolute;
            bottom: calc(15% + 17px);
            left: 0;
            width: 200%;
            height: 6px;
            background: repeating-linear-gradient(to right, #fff 0%, #fff 40px, transparent 40px, transparent 80px);
            animation: road-move 1s linear infinite;
        }

        
        .car {
            position: absolute;
            bottom: 15%;
            left: 0;
            width: 200px;
            height: 80px;
            animation: drive-in 3s ease-out forwards;
        }

        .car-body {
            position: absolute;
            bottom: 15px;
            left: 0;
            width: 100%;
            height: 40px; /* Чуть выше обычной легковушки */
            background: linear-gradient(to bottom, #222 0%, #000 100%);
            border-radius: 5px 10px 5px 5px; /* Угловатые формы */
            box-shadow: inset 0 -5px 10px rgba(0,0,0,0.8), 0 5px 10px rgba(0,0,0,0.5);
        }

        .car-cabin {
            position: absolute;
            bottom: 55px;
            left: 25px;
            width: 100px;
            height: 40px;
            background: linear-gradient(to bottom, #1a1a1a, #000);
            border-radius: 5px 10px 0 0;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.9);
        }

        .car-cabin::before {
            content: '';
            position: absolute;
            top: 5px;
            left: 10px;
            width: 35px;
            height: 25px;
            background: linear-gradient(135deg, #333 0%, #0a0a0a 100%); /* Тонировка */
            border-radius: 3px 5px 0 0;
            box-shadow: inset 0 0 5px rgba(255,255,255,0.1);
        }


        .car-cabin::after {
            content: '';
            position: absolute;
            top: 5px;
            right: 10px;
            width: 35px;
            height: 25px;
            background: linear-gradient(135deg, #222 0%, #050505 100%);
            border-radius: 5px 8px 0 0;
            box-shadow: inset 0 0 5px rgba(255,255,255,0.1);
        }

        .car-body::after {
            content: '';
            position: absolute;
            right: 0;
            top: 15px;
            width: 10px;
            height: 12px;
            background: #fff;
            border-radius: 0 3px 3px 0;
            box-shadow: 0 0 15px 5px rgba(200, 230, 255, 0.8); /* Яркий холодный свет */
        }


        .car-wheel {
            position: absolute;
            bottom: -5px; /* Чуть ниже кузова */
            left: 25px;
            width: 35px; /* Колеса больше */
            height: 35px;
        }

        .car-wheel::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #111;
            border-radius: 50%;
            border: 5px solid #333; /* Массивный диск */
            box-shadow: inset 0 0 5px #000;
            /* Внутренний диск (спицы) */
            background-image: radial-gradient(circle, #555 20%, #111 25%);
            animation: spin 0.5s linear infinite;
        }

        .car-wheel::after {
            content: '';
            position: absolute;
            top: 0;
            left: 105px; /* Смещение */
            width: 100%;
            height: 100%;
            background: #111;
            border-radius: 50%;
            border: 5px solid #333;
            box-shadow: inset 0 0 5px #000;
            background-image: radial-gradient(circle, #555 20%, #111 25%);
            animation: spin 0.5s linear infinite;
        }

        @keyframes drive-in {
            0% { left: -200px; }
            100% { left: calc(100vw - 250px); }
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        @keyframes road-move {
            0% { transform: translateX(0); }
            100% { transform: translateX(-80px); }
        }
    </style>
</head>
<body>
    <div class="car">
        <div class="car-body"></div>
        <div class="car-cabin"></div>
        <div class="car-wheel"></div>
    </div>
</body>
</html>
